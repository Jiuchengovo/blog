name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 8.210.189.204
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/blog
            git checkout main
            git pull
            node server/seed.js
            pm2 restart blog-api
